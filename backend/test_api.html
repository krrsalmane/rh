<!DOCTYPE html>
<html>
<head>
    <title>Test Leave Requests API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🧪 Test Leave Requests API</h1>
    
    <div class="test-section">
        <h2>Test Jean Dupont's Leave Requests</h2>
        <button onclick="testJean()">Test Jean (jean.dupont@test.com)</button>
        <div id="jean-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Marie Martin's Leave Requests</h2>
        <button onclick="testMarie()">Test Marie (marie.martin@test.com)</button>
        <div id="marie-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Pierre Bernard's Leave Requests</h2>
        <button onclick="testPierre()">Test Pierre (pierre.bernard@test.com)</button>
        <div id="pierre-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test All Requests (Manager View)</h2>
        <button onclick="testAll()">Test All (no filter)</button>
        <div id="all-result" class="result"></div>
    </div>

    <script>
        async function testJean() {
            const result = await fetch('/api/leaves', {
                method: 'GET',
                headers: {
                    'x-user-email': 'jean.dupont@test.com'
                }
            });
            const data = await result.json();
            document.getElementById('jean-result').innerHTML = 
                `<span class="success">✅ Success: ${data.data.requests.length} requests found</span><br>` +
                data.data.requests.map(r => ` - ${r.leave_type_name}: ${r.status} (${r.start_date} → ${r.end_date})`).join('<br>');
        }
        
        async function testMarie() {
            const result = await fetch('/api/leaves', {
                method: 'GET',
                headers: {
                    'x-user-email': 'marie.martin@test.com'
                }
            });
            const data = await result.json();
            document.getElementById('marie-result').innerHTML = 
                `<span class="success">✅ Success: ${data.data.requests.length} requests found</span><br>` +
                data.data.requests.map(r => ` - ${r.leave_type_name}: ${r.status} (${r.start_date} → ${r.end_date})`).join('<br>');
        }
        
        async function testPierre() {
            const result = await fetch('/api/leaves', {
                method: 'GET',
                headers: {
                    'x-user-email': 'pierre.bernard@test.com'
                }
            });
            const data = await result.json();
            document.getElementById('pierre-result').innerHTML = 
                `<span class="success">✅ Success: ${data.data.requests.length} requests found</span><br>` +
                data.data.requests.map(r => ` - ${r.leave_type_name}: ${r.status} (${r.start_date} → ${r.end_date})`).join('<br>');
        }
        
        async function testAll() {
            const result = await fetch('/api/leaves', {
                method: 'GET',
                headers: {
                    'x-user-email': 'manager@test.com'
                }
            });
            const data = await result.json();
            document.getElementById('all-result').innerHTML = 
                `<span class="success">✅ Success: ${data.data.requests.length} requests found</span><br>` +
                data.data.requests.map(r => ` - ${r.employee_name}: ${r.leave_type_name}: ${r.status} (${r.start_date} → ${r.end_date})`).join('<br>');
        }
    </script>
</body>
</html>
